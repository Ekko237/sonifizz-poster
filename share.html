<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<title>我的音乐人格海报 | SONIFIZZ</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body class="booting">
<main class="m-wrap">
  <header class="m-head">
    <span class="logo"><span class="logo-mark"></span><b>SONIFIZZ</b></span>
  </header>

  <!-- 正常态 -->
  <section id="okView" hidden>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div>
        <h1 class="m-title" id="pTitle"></h1>
        <p class="m-sub" id="pMotto" style="margin-top:6px"></p>
      </div>
      <div class="poster-box" id="posterBox"><img class="poster-img" id="posterImg" alt=""></div>
      <button class="btn btn-primary m-btn" id="saveBtn"><span class="ico" data-icon="download-simple"></span><span data-k="save">保存图片</span></button>
      <p class="save-hint" data-k="saveHint">也可以长按图片保存到相册</p>
      <button class="btn btn-ghost m-btn" id="shareBtn"><span class="ico" data-icon="share-network"></span><span data-k="share">分享给朋友</span></button>

      <div class="gift" id="gift">
        <h3 id="giftTitle"></h3>
        <p id="giftWhere"></p>
        <p class="code dot" id="giftCode"></p>
        <p data-k="limit">每张海报限领一次</p>
        <button class="btn" id="redeemBtn"><span class="ico" data-icon="gift"></span><span id="redeemLabel">店员核销</span></button>
      </div>

      <div class="invite">
        <h3 data-k="invite">你朋友是哪一派？</h3>
        <a class="btn btn-ghost m-btn pf-link" href="prefill.html"><span class="ico" data-icon="qr-code"></span><span data-k="makeOne">我也做一张</span></a>
      </div>
    </div>
  </section>

  <!-- 异常态 -->
  <section class="invalid" id="badView" hidden>
    <span class="ico" data-icon="warning"></span>
    <h1 class="m-title" data-k="badTitle">这张海报无法显示</h1>
    <p class="m-sub" data-k="badSub">链接可能不完整或被改动过</p>
    <a class="btn btn-primary m-btn pf-link" href="prefill.html" data-k="makeOne">我也做一张</a>
  </section>

  <footer class="m-foot">
    <span data-k="aiNote">本图由 AI 生成，仅供娱乐</span>
    <button id="reportBtn"><span class="ico" data-icon="flag"></span><span data-k="report">举报</span></button>
  </footer>
</main>

<div class="sheet-mask" id="reportSheet" hidden>
  <div class="sheet">
    <h3 data-k="reportTitle">举报这张海报</h3>
    <button class="opt" data-r="vulgar" data-k="r_vulgar">低俗或辱骂</button>
    <button class="opt" data-r="illegal" data-k="r_illegal">违法违规</button>
    <button class="opt" data-r="ad" data-k="r_ad">广告导流</button>
    <button class="opt" data-r="other" data-k="r_other">其他</button>
    <button class="btn btn-primary m-btn" id="reportSubmit" disabled data-k="submit">提交</button>
    <button class="btn btn-ghost m-btn" id="reportCancel" data-k="cancel">取消</button>
  </div>
</div>

<script src="vendor/icons.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/safety.js"></script>
<script src="js/poster.js"></script>
<script src="js/share.js"></script>
</body>
</html>
